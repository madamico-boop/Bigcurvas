<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | Bigcurvas</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>

    <main>

        <h1>Bigcurvas</h1>

        <h2>Iniciar sesión</h2>


        <form id="loginForm">

            <label for="correo">
                Correo
            </label>

            <input
                type="email"
                id="correo"
                required
                autocomplete="email"
            >


            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
            >


            <button type="submit">
                Iniciar sesión
            </button>

        </form>


        <p id="mensajeLogin"></p>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
