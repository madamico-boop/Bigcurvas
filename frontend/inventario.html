<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventario | Bigcurvas</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="dashboard-body">

    <aside class="sidebar">
        <h2>Bigcurvas</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="inventario.html">Inventario</a>
            <a href="ventas.html">Registrar venta</a>
            <a href="historial.html">Historial de ventas</a>
            <a href="productos.html">Productos</a>
            <a href="clientes.html">Clientes</a>
            <a href="reportes.html">Reportes</a>
        </nav>
    </aside>

    <main class="dashboard">

        <h1>Inventario</h1>
        <p>Control de stock de productos</p>

        <!-- ========================= -->
        <!-- FILTROS -->
        <!-- ========================= -->

        <section class="filtros-inventario">

            <div class="campo-filtro campo-filtro-busqueda">
                <label for="buscarInventario">
                    Buscar
                </label>

                <input
                    type="search"
                    id="buscarInventario"
                    placeholder="Producto, color o talla"
                    autocomplete="off"
                >
            </div>

            <div class="campo-filtro">
                <label for="filtroSucursal">
                    Sucursal
                </label>

                <select id="filtroSucursal">
                    <option value="">
                        Todas las sucursales
                    </option>
                </select>
            </div>

            <div class="campo-filtro">
                <label for="filtroEstado">
                    Estado
                </label>

                <select id="filtroEstado">
                    <option value="">Todos los estados</option>
                    <option value="Disponible">Disponible</option>
                    <option value="Stock bajo">Stock bajo</option>
                    <option value="Sin stock">Sin stock</option>
                </select>
            </div>

            <button
                type="button"
                id="limpiarFiltrosInventario"
                class="boton-secundario"
            >
                Limpiar filtros
            </button>

        </section>

        <p
            id="contadorInventario"
            class="contador-resultados"
        ></p>


        <!-- ========================= -->
        <!-- EDITAR INVENTARIO -->
        <!-- ========================= -->

        <section
            id="editarInventarioSection"
            class="productos-grid"
            hidden
        >

            <div class="producto-form-container">

                <h2>Editar inventario</h2>

                <p id="inventarioSeleccionado"></p>

                <form
                    id="editarInventarioForm"
                    class="venta-form"
                >

                    <label for="editarStockActual">
                        Stock actual
                    </label>

                    <input
                        type="number"
                        id="editarStockActual"
                        min="0"
                        step="1"
                        required
                    >


                    <label for="editarStockMinimo">
                        Stock mínimo (opcional)
                    </label>

                    <input
                        type="number"
                        id="editarStockMinimo"
                        min="0"
                        step="1"
                    >


                    <button type="submit">
                        Guardar cambios
                    </button>

                    <button
                        type="button"
                        id="cancelarInventario"
                    >
                        Cancelar
                    </button>

                </form>

                <p id="mensajeInventario"></p>

            </div>

        </section>


        <!-- ========================= -->
        <!-- TABLA -->
        <!-- ========================= -->

        <table class="inventory-table">

            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Color</th>
                    <th>Talla</th>
                    <th>Sucursal</th>
                    <th>Stock</th>
                    <th>Stock mínimo</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaInventario">
            </tbody>

        </table>

    </main>

    <script src="js/inventario.js"></script>
    <script src="js/sesion.js"></script>

</body>
</html>
