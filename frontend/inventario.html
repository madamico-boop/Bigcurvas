<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventario | Bigcurvas</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="dashboard-body">

    <aside class="sidebar">
        <h2>Bigcurvas</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="inventario.html">Inventario</a>
            <a href="ventas.html">Registrar venta</a>
            <a href="productos.html">Productos</a>
             <a href="clientes.html">Clientes</a>
            <a href="#">Reportes</a>
        </nav>
    </aside>

    <main class="dashboard">

        <h1>Inventario</h1>
        <p>Control de stock de productos</p>
        <section
    id="editarInventarioSection"
    class="productos-grid"
    hidden
>

    <div class="producto-form-container">

        <h2>Editar inventario</h2>

        <p id="inventarioSeleccionado"></p>

        <form
            id="editarInventarioForm"
            class="venta-form"
        >

            <label for="editarStockActual">
                Stock actual
            </label>

            <input
                type="number"
                id="editarStockActual"
                min="0"
                step="1"
                required
            >


            <label for="editarStockMinimo">
                Stock mínimo (opcional)
            </label>

            <input
                type="number"
                id="editarStockMinimo"
                min="0"
                step="1"
            >


            <button type="submit">
                Guardar cambios
            </button>

            <button
                type="button"
                id="cancelarInventario"
            >
                Cancelar
            </button>

        </form>

        <p id="mensajeInventario"></p>

    </div>

</section>

        <table class="inventory-table">

    <thead>
    <tr>
        <th>Producto</th>
        <th>Color</th>
        <th>Talla</th>
        <th>Sucursal</th>
        <th>Stock</th>
        <th>Stock mínimo</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
</thead>

    <tbody id="tablaInventario">
    </tbody>

</table>

    </main>
    <script src="js/inventario.js"></script>


</body>
</html>
