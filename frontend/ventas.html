<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar venta | Bigcurvas</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="dashboard-body">

    <aside class="sidebar">
        <h2>Bigcurvas</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="inventario.html">Inventario</a>
            <a href="ventas.html">Registrar venta</a>
            <a href="productos.html">Productos</a>
             <a href="clientes.html">Clientes</a>
            <a href="#">Reportes</a>
        </nav>
    </aside>

    <main class="dashboard">

        <h1>Registrar venta</h1>
        <p>Ingrese los datos de la venta</p>

        <form id="ventaForm" class="venta-form">

            <label for="producto">Producto</label>
            <select id="producto" required>
                <option value="">Seleccione un producto</option>
            </select>

            <label for="color">Color</label>
            <select id="color" required disabled>
                <option value="">Seleccione un color</option>
            </select>

            <label for="talla">Talla</label>
            <select id="talla" required disabled>
                <option value="">Seleccione una talla</option>
            </select>

            <label for="sucursal">Sucursal</label>
            <select id="sucursal" required disabled>
                <option value="">Seleccione una sucursal</option>
            </select>

            <p id="stockDisponible">
                Stock disponible: -
            </p>

            <label for="cantidad">Cantidad</label>
            <input
                type="number"
                id="cantidad"
                min="1"
                required
            >

            <button type="submit">
                Registrar venta
            </button>

        </form>

        <p id="mensajeVenta"></p>

    </main>

    <script src="js/ventas.js"></script>

</body>
</html>
