<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar venta | Bigcurvas</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="dashboard-body">

    <aside class="sidebar">
        <h2>Bigcurvas</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="inventario.html">Inventario</a>
            <a href="ventas.html">Registrar venta</a>
            <a href="historial.html">Historial de ventas</a>
            <a href="productos.html">Productos</a>
            <a href="clientes.html">Clientes</a>
            <a href="reportes.html">Reportes</a>
        </nav>
    </aside>

    <main class="dashboard">

        <h1>Registrar venta</h1>
        <p>Agregue uno o más productos a la venta</p>


        <!-- CLIENTE -->

        <div class="venta-form">

            <label for="cliente">
                Cliente (opcional)
            </label>

            <select id="cliente">
                <option value="">
                    Venta sin cliente
                </option>
            </select>

        </div>


        <!-- AGREGAR PRODUCTO -->

        <form id="ventaForm" class="venta-form">

            <h2>Agregar producto</h2>

            <label for="producto">
                Producto
            </label>

            <select id="producto" required>
                <option value="">
                    Seleccione un producto
                </option>
            </select>


            <label for="color">
                Color
            </label>

            <select id="color" required disabled>
                <option value="">
                    Seleccione un color
                </option>
            </select>


            <label for="talla">
                Talla
            </label>

            <select id="talla" required disabled>
                <option value="">
                    Seleccione una talla
                </option>
            </select>


            <label for="sucursal">
                Sucursal
            </label>

            <select id="sucursal" required disabled>
                <option value="">
                    Seleccione una sucursal
                </option>
            </select>


            <p id="stockDisponible">
                Stock disponible: -
            </p>


            <label for="cantidad">
                Cantidad
            </label>

            <input
                type="number"
                id="cantidad"
                min="1"
                required
            >


            <button type="submit">
                Agregar a la venta
            </button>

        </form>


        <!-- CARRITO -->

        <h2 class="titulo-tabla">
            Productos de la venta
        </h2>

        <table class="inventory-table">

            <thead>

                <tr>
                    <th>Producto</th>
                    <th>Color</th>
                    <th>Talla</th>
                    <th>Sucursal</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th>Acción</th>
                </tr>

            </thead>

            <tbody id="tablaCarrito">
            </tbody>

        </table>


        <h3 id="totalVenta">
            Total: $0
        </h3>


        <button
            type="button"
            id="confirmarVenta"
        >
            Confirmar venta
        </button>


        <p id="mensajeVenta"></p>

    </main>

    <script src="js/ventas.js"></script>

</body>
</html>
