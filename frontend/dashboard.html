<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Bigcurvas</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/dashboard.js"></script>

<body class="dashboard-body">

    <aside class="sidebar">
        <h2>Bigcurvas</h2>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="inventario.html">Inventario</a>
            <a href="ventas.html">Registrar venta</a>
            <a href="historial.html">Historial de ventas</a>
            <a href="productos.html">Productos</a>
             <a href="clientes.html">Clientes</a>
            <a href="#">Reportes</a>
        </nav>
    </aside>

    <main class="dashboard">

        <h1>Dashboard</h1>
<p>Resumen general de Bigcurvas</p>


<section class="dashboard-cards">

    <div class="dashboard-card">
        <h3>Ventas de hoy</h3>
        <p id="ventasHoy">$0</p>
    </div>


    <div class="dashboard-card">
        <h3>Ventas del mes</h3>
        <p id="ventasMes">$0</p>
    </div>


    <div class="dashboard-card">
        <h3>Stock total</h3>
        <p id="stockTotal">0</p>
    </div>


    <div class="dashboard-card">
        <h3>Stock bajo</h3>
        <p id="stockBajo">0</p>
    </div>

</section>


<section class="graficos-dashboard">

    <div class="grafico-card">

        <h2>Ventas últimos 7 días</h2>

        <canvas id="graficoVentasDias"></canvas>

    </div>


    <div class="grafico-card">

        <h2>Ventas por sucursal</h2>

        <canvas id="graficoSucursales"></canvas>

    </div>

</section>


<section class="grafico-card">

    <h2>Productos más vendidos del mes</h2>

    <canvas id="graficoProductos"></canvas>

</section>

    </main>

</body>
</html>
